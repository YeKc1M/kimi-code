name: Sync upstream into feature branch

on:
  schedule:
    # 23:15 UTC = 07:15 Beijing time (UTC+8), daily
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-feature-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Repo pins pnpm via the packageManager field; corepack ships with Node
      # and provides exactly that version. Native deps (node-pty) build with
      # the runner's preinstalled gcc/python3.
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install kimi CLI
        run: npm install -g @moonshot-ai/kimi-code

      - name: Sync upstream into feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          FEATURE_BRANCH: ${{ vars.FEATURE_BRANCH }}
          SYNC_BRANCH: ${{ vars.SYNC_BRANCH }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH }}
        run: bash .github/scripts/sync-feature-upstream.sh
